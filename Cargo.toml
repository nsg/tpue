[package]
name = "tpue"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart", "json"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
fast_image_resize = "6"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libloading = "0.9.0"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.dev.package."*"]
opt-level = 3
