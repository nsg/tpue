<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tpue API</title>
<script>
try { document.documentElement.dataset.theme = localStorage.getItem('theme') || ''; } catch (error) {}
</script>
<style>
:root{color-scheme:light dark;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#e3e2dd;--bar:#2a78d6;--track:#cde2fb;--code:#eeede9;--good:#0ca30c;--critical:#d03b3b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--line:#383835;--bar:#3987e5;--track:#0d366b;--code:#2a2a28}}
:root[data-theme=dark]{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--line:#383835;--bar:#3987e5;--track:#0d366b;--code:#2a2a28}
:root[data-theme=light]{color-scheme:light}
#theme{font:inherit;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.1rem .5rem;cursor:pointer}
body{font:16px/1.5 system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;background:var(--page);color:var(--ink)}
code{background:var(--code);padding:.15rem .3rem;border-radius:3px}
pre{background:var(--code);padding:.8rem;overflow-x:auto;border-radius:6px}
pre code{background:none;padding:0}
table{border-collapse:collapse}
th,td{border:1px solid var(--line);padding:.4rem .6rem;text-align:left}
nav{font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
table{display:block;overflow-x:auto;max-width:100%}
h1,h2{line-height:1.25}
@media (max-width:600px){body{margin:1rem auto;font-size:15px}th,td{padding:.3rem .4rem}}
</style>
</head>
<body>
<nav><a href="/">&larr; Live statistics</a><button id="theme" type="button" aria-label="Switch colour theme"></button></nav>
{{docs}}
<script>
{
  const root = document.documentElement, button = document.getElementById('theme');
  const dark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  const label = () => { button.textContent = dark() ? 'Light' : 'Dark'; };
  button.onclick = () => {
    root.dataset.theme = dark() ? 'light' : 'dark';
    try { localStorage.setItem('theme', root.dataset.theme); } catch (error) {}
    label();
  };
  matchMedia('(prefers-color-scheme:dark)').onchange = label;
  label();
}
</script>
</body>
</html>
